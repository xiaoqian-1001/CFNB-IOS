name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb .
          
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb-server ./cmd/server/
          
          file cfnb
          file cfnb-server
      
      - name: Build Swift app binary
        run: |
          cd ${{ github.workspace }}
          
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          cat > main.swift << 'SWIFTEOF'
          import UIKit
          import WebKit
          import Foundation
          
          class AppDelegate: UIResponder, UIApplicationDelegate, WKNavigationDelegate {
            var window: UIWindow?
            var webView: WKWebView?
            var process: Process?
            let port: UInt16 = 8080
          
            func application(_ application: UIApplication,
                             didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
          
              let config = WKWebViewConfiguration()
              webView = WKWebView(frame: UIScreen.main.bounds, configuration: config)
              webView!.navigationDelegate = self
          
              window?.rootViewController = UIViewController()
              window?.rootViewController?.view = webView
          
              startServer()
          
              window?.makeKeyAndVisible()
              return true
            }
          
            func startServer() {
              process = Process()
          
              let exe = Bundle.main.bundlePath + "/cfnb-server"
              process!.executableURL = URL(fileURLWithPath: exe)
          
              var env = ProcessInfo.processInfo.environment
              env["PORT"] = "\(port)"
              if let webDir = Bundle.main.path(forResource: "web", ofType: nil) {
                env["WEB_DIR"] = webDir
              } else {
                env["WEB_DIR"] = Bundle.main.bundlePath + "/web"
              }
              process!.environment = env
          
              do {
                try process!.run()
              } catch {
                print("Failed to start server: \(error)")
                loadDashboard()
                return
              }
          
              DispatchQueue.main.asyncAfter(deadline: .now() + 2) { [weak self] in
                self?.loadDashboard()
              }
            }
          
            func loadDashboard() {
              guard let wv = webView else { return }
              let url = URL(string: "http://127.0.0.1:\(port)")!
              wv.load(URLRequest(url: url))
            }
          
            func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
              print("WebView error: \(error)")
              DispatchQueue.main.asyncAfter(deadline: .now() + 2) { [weak self] in
                self?.loadDashboard()
              }
            }
          
            func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
              print("WebView loaded successfully")
            }
          }
          
          UIApplicationMain(
            CommandLine.argc,
            CommandLine.unsafeArgv,
            nil,
            NSStringFromClass(AppDelegate.self)
          )
          SWIFTEOF
          
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios12.0 \
            -O -whole-module-optimization \
            -framework UIKit -framework WebKit -framework Foundation \
            -parse-as-library \
            main.swift -o CFNB
          
          file CFNB
          echo "Swift app binary compiled successfully"
      
      - name: Create app bundle and IPA
        run: |
          cd ${{ github.workspace }}
          
          mkdir -p Payload/CFNB.app
          
          cp CFNB Payload/CFNB.app/CFNB
          cp cfnb-go/cfnb-server Payload/CFNB.app/cfnb-server
          chmod +x Payload/CFNB.app/CFNB Payload/CFNB.app/cfnb-server
          
          cp -r cfnb-go/web Payload/CFNB.app/web
          
          cat > Payload/CFNB.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
          
          echo "Bundle structure:"
          find Payload -type f | sort
          
          mkdir -p build
          cd build
          zip -r CFNB.ipa ../Payload/
          cd ..
          
          ls -lh build/CFNB.ipa
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

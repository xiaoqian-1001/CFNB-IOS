name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb .
          file cfnb
      
      - name: Create Xcode project structure
        run: |
          cd ${{ github.workspace }}
          
          # ─── 1. Create the Xcode project directory ───
          mkdir -p CFNB.xcodeproj/project.xcworkspace
          
          # ─── 2. Create Info.plist (will be at project root, matching PBXProj path) ───
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
          </dict>
          </plist>
          EOF
          
          # ─── 3. Create main.swift AT PROJECT ROOT (matching PBXProj reference) ───
          cat > main.swift << 'EOF'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  let label = UILabel()
                  label.text = "CFNB - Cloudflare IP Optimizer"
                  label.textAlignment = .center
                  label.textColor = .white
                  label.frame = CGRect(x: 50, y: 200, width: 300, height: 50)
                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF
          
          # ─── 4. Copy Go binary into a Resources-like placeholder directory ───
          mkdir -p AppResources
          cp cfnb-go/cfnb AppResources/CFNB
          chmod +x AppResources/CFNB
          
          echo "Files created:"
          ls -la
          echo "---"
          cat main.swift
      
      - name: Generate project.pbxproj
        run: |
          cd ${{ github.workspace }}
          
          cat > CFNB.xcodeproj/project.pbxproj << 'EOFPROJ'
          // !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = { };
          	objectVersion = 56;
          	objects = {
          
          /* Begin PBXBuildFile section */
          		F1000001 /* main.swift in Sources */ = {isa = PBXBuildFile; fileRef = F1000101; };
          /* End PBXBuildFile section */
          
          /* Begin PBXFileReference section */
          		F1000101 /* main.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = main.swift; sourceTree = "<group>"; };
          		F1000102 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          		F1000103 /* CFNB.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CFNB.app; sourceTree = BUILT_PRODUCTS_DIR; };
          /* End PBXFileReference section */
          
          /* Begin PBXGroup section */
          		F1000201 = {
          			isa = PBXGroup;
          			children = (
          				F1000301,
          			);
          			sourceTree = "<group>";
          		};
          		F1000301 /* Source files */ = {
          			isa = PBXGroup;
          			children = (
          				F1000101,
          				F1000102,
          			);
          			path = "";
          			sourceTree = "<group>";
          		};
          /* End PBXGroup section */
          
          /* Begin PBXNativeTarget section */
          		F10003T1 /* CFNB */ = {
          			isa = PBXNativeTarget;
          			buildConfigurationList = F1000502;
          			buildPhases = (
          				F10004S1,
          				F10004R1,
          				F10004F1,
          			);
          			buildRules = ( );
          			dependencies = ( );
          			name = CFNB;
          			productName = CFNB;
          			productReference = F1000103;
          			productType = "com.apple.product-type.application";
          		};
          /* End PBXNativeTarget section */
          
          /* Begin PBXProject section */
          		F1000901 = {
          			isa = PBXProject;
          			attributes = { BuildIndependentTargetsInParallel = 1; };
          			buildConfigurationList = F1000501;
          			compatibilityVersion = "Xcode 14.0";
          			developmentRegion = en;
          			hasScannedForEncodings = 0;
          			knownRegions = ( en, Base );
          			mainGroup = F1000201;
          			productRefGroup = F1000301;
          			projectDirPath = "";
          			projectRoot = "";
          			targets = (
          				F10003T1,
          			);
          		};
          /* End PBXProject section */
          
          /* Begin PBXResourcesBuildPhase section */
          		F10004R1 /* Resources */ = {
          			isa = PBXResourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXResourcesBuildPhase section */
          
          /* Begin PBXSourcesBuildPhase section */
          		F10004S1 /* Sources */ = {
          			isa = PBXSourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( F1000001, );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXSourcesBuildPhase section */
          
          /* Begin PBXFrameworksBuildPhase section */
          		F10004F1 /* Frameworks */ = {
          			isa = PBXFrameworksBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXFrameworksBuildPhase section */
          
          /* Begin XCBuildConfiguration section */
          		F1000A01 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				CODE_SIGN_STYLE = Manual;
          				CURRENT_PROJECT_VERSION = 1;
          				DEVELOPMENT_TEAM = "";
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = Info.plist;
          				LINKER_DISPLAYS_MANGLED_NAMES = NO;
          				PRODUCT_BUNDLE_IDENTIFIER = com.cfnb.app;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_EMIT_LOC_STRINGS = YES;
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Release;
          		};
          		F1000902 = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = dwarf;
          				ENABLE_STRICT_OBJC_MSGSEND = YES;
          				GCC_C_LANGUAGE_STANDARD = gnu17;
          				GCC_NO_COMMON_BLOCKS = YES;
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 12.0;
          				MTL_ENABLE_DEBUG_INFO = NO;
          				ONLY_ACTIVE_ARCH = YES;
          				SDKROOT = iphoneos;
          				SWIFT_OPTIMIZATION_LEVEL = "-Onone";
          				OTHER_SWIFT_FLAGS = "$(inherited) -parse-as-library";
          			};
          			name = Release;
          		};
          /* End XCBuildConfiguration section */
          
          /* Begin XCConfigurationList section */
          		F1000501 /* Build configuration list for PBXProject "CFNB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = ( F1000902, );
          			defaultConfigurationIsVisible = 0;
          		};
          		F1000502 /* Build configuration list for PBXNativeTarget "CFNB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = ( F1000A01, );
          			defaultConfigurationIsVisible = 0;
          		};
          /* End XCConfigurationList section */
          
          	};
          	rootObject = F1000901;
          }
          EOFPROJ
          
          echo "PBXProj generated successfully"
          wc -l CFNB.xcodeproj/project.pbxproj
      
      - name: Archive
        run: |
          cd ${{ github.workspace }}
          xcodebuild archive \
            -scheme CFNB \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/CFNB.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$GITHUB_WORKSPACE/build/SYM \
            OBJROOT=$GITHUB_WORKSPACE/build/OBJ \
            BUILD_DIR=$GITHUB_WORKSPACE/build
      
      - name: Export IPA
        run: |
          cd ${{ github.workspace }}
          
          # Verify xcarchive exists
          if [ ! -d "build/CFNB.xcarchive" ]; then
            echo "ERROR: xcarchive not found!"
            exit 1
          fi
          
          APP_PATH="build/CFNB.xcarchive/Products/Applications/CFNB.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Looking for app in xcarchive..."
            ls -la build/CFNB.xcarchive/
            echo "ERROR: CFNB.app not found in xcarchive!"
            exit 1
          fi
          
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          
          # Create exportOptions.plist using python3 (avoids YAML/heredoc issues with XML tags)
          python3 -c "
          import plistlib, io
          opts = {'method': 'ad-hoc', 'signingStyle': 'manual', 'stripSwiftSymbols': True, 'uploadSymbols': False, 'teamID': ''}
          with open('build/exportOptions.plist', 'wb') as f:
              f.write(plistlib.dump(opts, f))
          "
          
          echo "Creating zip-based IPA at Payload level..."
          cd build
          zip -r CFNB.ipa Payload/
          cd ..
          
          if [ -f "build/CFNB.ipa" ]; then
            echo "IPA created successfully!"
            ls -lh build/CFNB.ipa
          else
            echo "WARNING: Check build structure"
            ls -la build/
          fi
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/IPA/CFNB.ipa
          retention-days: 30

name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go static library for iOS (c-archive)
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          
          echo "=== Building libcfnb.a (c-archive) ==="
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$CLANG -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=16.0" \
            CGO_CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=16.0" \
            CGO_LDFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=16.0 -lsqlite3" \
            go build -buildmode=c-archive -tags ios -ldflags="-s -w" \
            -o "${{ github.workspace }}/libcfnb.a" ./cmd/server/ 2>&1 || { echo "c-archive build failed"; ls -la "${{ github.workspace }}/"*.a 2>/dev/null; exit 1; }
          
          echo "=== Checking artifacts ==="
          ls -lh "${{ github.workspace }}/libcfnb.a" 2>/dev/null || echo "libcfnb.a not generated"
          ls -lh "${{ github.workspace }}/libcfnb.h" 2>/dev/null || echo "libcfnb.h not generated"
          
      - name: Build and link ObjC app with Go library
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          INSTALL_NAME_TOOL=$(xcrun --sdk iphoneos --find install_name_tool)
          
          if [ ! -f libcfnb.a ] || [ ! -f libcfnb.h ]; then
            echo "ERROR: libcfnb.a or libcfnb.h not found. c-archive build failed."
            exit 1
          fi
          
          cat > main.mm << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          extern "C" {
          #include "libcfnb.h"
          }

          @interface WebViewController : UIViewController
          @property (strong, nonatomic) WKWebView *webView;
          @end

          @implementation WebViewController
          - (BOOL)prefersStatusBarHidden { return NO; }
          - (BOOL)prefersHomeIndicatorAutoHidden { return YES; }
          - (void)viewDidLoad {
                [super viewDidLoad];
                self.view.backgroundColor = [UIColor colorWithRed:0.039 green:0.055 blue:0.078 alpha:1];
                self.webView.frame = [UIScreen mainScreen].bounds;
                self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                [self.view addSubview:self.webView];
          }
          - (void)viewDidLayoutSubviews {
                [super viewDidLayoutSubviews];
                self.webView.frame = [UIScreen mainScreen].bounds;
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate, WKNavigationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) WKWebView *webView;
          @property (strong, nonatomic) WebViewController *viewController;
          @property (assign, nonatomic) int retryCount;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
                self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                self.retryCount = 0;
                WKWebViewConfiguration *c = [[WKWebViewConfiguration alloc] init];
                self.webView = [[WKWebView alloc] initWithFrame:[UIScreen mainScreen].bounds configuration:c];
                self.webView.navigationDelegate = self;
                self.webView.backgroundColor = [UIColor colorWithRed:0.039 green:0.055 blue:0.078 alpha:1];
                self.webView.scrollView.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;
                self.webView.scrollView.contentInset = UIEdgeInsetsZero;
                self.webView.scrollView.scrollIndicatorInsets = UIEdgeInsetsZero;
                self.webView.scrollView.bounces = NO;
                self.webView.scrollView.alwaysBounceVertical = NO;
                self.viewController = [[WebViewController alloc] init];
                self.viewController.webView = self.webView;
                self.window.rootViewController = self.viewController;
                [self.window makeKeyAndVisible];
                [self showLoading];

                // Switch to writable Documents directory for iOS sandbox
                NSString *docs = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
                chdir([docs UTF8String]);
               // Copy config.json from bundle to Documents
                NSString *bundleCfg = [[[NSBundle mainBundle] bundlePath] stringByAppendingPathComponent:@"config.json"];
                NSString *docsCfg = [docs stringByAppendingPathComponent:@"config.json"];
                [[NSFileManager defaultManager] copyItemAtPath:bundleCfg toPath:docsCfg error:nil];

                StartServer("9999");
                dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ [self tryLoad]; });
                return YES;
            }

          - (void)showLoading {
                [self.webView loadHTMLString:@"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><style>html{height:100%}body{background:#0d1117;color:#8b949e;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100%;height:100vh;height:100dvh;margin:0;flex-direction:column}@keyframes s{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}d{width:40px;height:40px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:s 1s infinite;margin-bottom:16px}p{font-size:13px;margin:4px 0}</style></head><body><d></d><p>Starting CFNB Server...</p></body></html>" baseURL:nil];
            }

          - (void)tryLoad {
                self.retryCount++;
                NSMutableURLRequest *r = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:@"http://127.0.0.1:9999"]];
                r.timeoutInterval = 3;
                [[NSURLSession.sharedSession dataTaskWithRequest:r completionHandler:^(NSData *d, NSURLResponse *rsp, NSError *e) {
                    dispatch_async(dispatch_get_main_queue(), ^{
                        if (!e && [(NSHTTPURLResponse *)rsp statusCode] == 200) {
                            [self.webView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"http://127.0.0.1:9999"]]];
                        } else if (self.retryCount < 20) {
                            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ [self tryLoad]; });
                        } else {
                            [self.webView loadHTMLString:@"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><style>html{height:100%}body{background:#0d1117;color:#f85149;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100%;height:100vh;height:100dvh;margin:0;font-size:13px}</style></head><body>Server failed.<br/>iOS may block subprocess.</body></html>" baseURL:nil];
                        }
                    });
                }] resume];
            }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class])); }
          }
          OBJCEOF

          clang++ -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=16.0 \
            -framework UIKit -framework WebKit -framework Foundation \
            -framework CoreFoundation -framework Security -framework CFNetwork \
            -lc++ -lsqlite3 \
            -fobjc-arc -I. -o CFNB main.mm libcfnb.a >clang-link.log 2>&1 || { echo "=== CLANG LINKING FAILED ==="; cat clang-link.log; exit 1; }
          
          echo "App binary: $(ls -lh CFNB)"
      
      - name: Create app bundle and IPA
        run: |
          cd ${{ github.workspace }}
          mkdir -p Payload/CFNB.app
          cp CFNB Payload/CFNB.app/CFNB
          chmod +x Payload/CFNB.app/CFNB
          cp -r cfnb-go/web Payload/CFNB.app/web
          cp cfnb-go/config.json Payload/CFNB.app/config.json
          
          cat > Payload/CFNB.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>UIStatusBarHidden</key>
              <false/>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
          echo "Bundle structure:"
          find Payload -type f | sort
          
          mkdir -p build
          cd build
          zip -r CFNB.ipa ../Payload/
          cd ..
          
          ls -lh build/CFNB.ipa
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

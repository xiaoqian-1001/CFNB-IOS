name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb .
          
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb-server ./cmd/server/
          
          file cfnb
          file cfnb-server
      
      - name: Build ObjC app binary
        run: |
          cd ${{ github.workspace }}
          
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          cat > main.m << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <spawn.h>
          #import <sys/wait.h>
          
          extern char **environ;
          
          @interface AppDelegate : UIResponder <UIApplicationDelegate, WKNavigationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) WKWebView *webView;
          @property (assign, nonatomic) int retryCount;
          @end
          
          @implementation AppDelegate
          
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.retryCount = 0;
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:config];
              self.webView.navigationDelegate = self;
              self.webView.backgroundColor = [UIColor colorWithRed:0.05 green:0.07 blue:0.09 alpha:1.0];
              self.webView.opaque = NO;
          
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view = self.webView;
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
          
              // Show loading HTML immediately
              [self showLoading];
          
              // Start Go server in background
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  [self startServer];
              });
          
              return YES;
          }
          
          - (void)showLoading {
              NSString *html = @"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{background:#0d1117;color:#8b949e;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}div{width:40px;height:40px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 1s infinite;margin-bottom:16px}p{font-size:13px;margin:4px 0}</style></head><body><div></div><p>Starting CFNB Server...</p><p style='font-size:11px;color:#484f58'>Cloudflare IP Optimizer</p></body></html>";
              [self.webView loadHTMLString:html baseURL:nil];
          }
          
          - (void)startServer {
              NSString *bundlePath = [[NSBundle mainBundle] bundlePath];
              NSString *serverPath = [bundlePath stringByAppendingPathComponent:@"cfnb-server"];
              NSString *webDir = [bundlePath stringByAppendingPathComponent:@"web"];
              
              // Set env vars for the child process
              setenv("PORT", "8080", 1);
              setenv("WEB_DIR", [webDir UTF8String], 1);
              
              pid_t pid;
              const char *argv[] = {[serverPath UTF8String], NULL};
              
              int ret = posix_spawn(&pid, [serverPath UTF8String], NULL, NULL, (char *const *)argv, environ);
              if (ret != 0) {
                  NSLog(@"posix_spawn failed: %d", ret);
                  return;
              }
          
              // Don't wait — let it run as daemon
              NSLog(@"cfnb-server started with pid %d", pid);
          
              // Try loading the dashboard after delay
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self tryLoadDashboard];
              });
          }
          
          - (void)tryLoadDashboard {
              self.retryCount++;
              NSURL *url = [NSURL URLWithString:@"http://127.0.0.1:8080"];
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];
              req.timeoutInterval = 5.0;
          
              NSURLSession *session = [NSURLSession sharedSession];
              [[session dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (!error && [(NSHTTPURLResponse *)response statusCode] == 200) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [self.webView loadRequest:[NSURLRequest requestWithURL:url]];
                      });
                  } else {
                      NSLog(@"Dashboard not ready (retry %d): %@", self.retryCount, error);
                      if (self.retryCount < 10) {
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              [self tryLoadDashboard];
                          });
                      } else {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              NSString *err = [NSString stringWithFormat:@"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{background:#0d1117;color:#f85149;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-size:13px}</style></head><body>Server failed to start.<br/>Tried 10 times.</body></html>"];
                              [self.webView loadHTMLString:err baseURL:nil];
                          });
                      }
                  }
              }] resume];
          }
          
          - (void)webView:(WKWebView *)webView didFailNavigation:(WKNavigation *)navigation withError:(NSError *)error {
              NSLog(@"WebView error: %@", error);
              if (self.retryCount < 10) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      [self tryLoadDashboard];
                  });
              }
          }
          
          - (void)webView:(WKWebView *)webView didFailProvisionalNavigation:(WKNavigation *)navigation withError:(NSError *)error {
              NSLog(@"WebView provisional error: %@", error);
              if (self.retryCount < 10) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      [self tryLoadDashboard];
                  });
              }
          }
          
          @end
          
          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          OBJCEOF
          
          echo "=== Compiling Objective-C app binary ==="
          clang -arch arm64 -isysroot "$SDK_PATH" \
            -miphoneos-version-min=12.0 \
            -framework UIKit -framework WebKit -framework Foundation \
            -fobjc-arc \
            -o CFNB main.m
          
          if [ ! -f CFNB ]; then
            echo "ERROR: Objective-C compilation failed!"
            exit 1
          fi
          
          file CFNB
          ls -la CFNB
          echo "ObjC app binary compiled successfully"
          
          file CFNB
          echo "Swift app binary compiled successfully"
      
      - name: Create app bundle and IPA
        run: |
          cd ${{ github.workspace }}
          
          mkdir -p Payload/CFNB.app
          
          cp CFNB Payload/CFNB.app/CFNB
          cp cfnb-go/cfnb-server Payload/CFNB.app/cfnb-server
          chmod +x Payload/CFNB.app/CFNB Payload/CFNB.app/cfnb-server
          
          cp -r cfnb-go/web Payload/CFNB.app/web
          
          cat > Payload/CFNB.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
          
          echo "Bundle structure:"
          find Payload -type f | sort
          
          mkdir -p build
          cd build
          zip -r CFNB.ipa ../Payload/
          cd ..
          
          ls -lh build/CFNB.ipa
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

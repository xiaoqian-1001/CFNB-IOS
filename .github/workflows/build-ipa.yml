name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb .
          
          # Also build the web server
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb-server ./cmd/server/
          
          file cfnb
          file cfnb-server
      
      - name: Create Xcode project structure
        run: |
          cd ${{ github.workspace }}
          
          # ─── 1. Create the Xcode project directory ───
          mkdir -p CFNB.xcodeproj/project.xcworkspace
          
          # ─── 2. Copy web assets into the project ───
          cp -r cfnb-go/web CFNB.app.web

          # ─── 3. Create Info.plist ───
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
          
          # ─── 4. Create main.swift with server startup and WebView ───
          cat > main.swift << 'SWIFTEOF'
          import UIKit
          import WebKit
          import os

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate, WKNavigationDelegate {
              var window: UIWindow?
              var process: Process?
              var port = 8080
              var webView: WKWebView?
              let logger = Logger(subsystem: "com.cfnb.app", category: "main")

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  
                  // Launch Go backend server
                  startServer()
                  
                  // Create webview
                  let config = WKWebViewConfiguration()
                  webView = WKWebView(frame: UIScreen.main.bounds, configuration: config)
                  webView!.navigationDelegate = self
                  
                  // Wait for server to be ready then load URL
                  DispatchQueue.global().asyncAfter(deadline: .now() + 2) { [weak self] in
                      self?.loadDashboard()
                  }
                  
                  window?.rootViewController = UIViewController()
                  if let vc = window?.rootViewController, let wv = webView {
                      vc.view = wv
                  }
                  window?.makeKeyAndVisible()
                  return true
              }

              func startServer() {
                  process = Process()
                  let exePath = Bundle.main.bundlePath as NSString
                  
                  // Find cfnb-server binary
                  let candidates = [
                      exePath.appendingPathComponent("cfnb-server"),
                      exePath.appending("/CFNB.app/cfnb-server"),
                      exePath.deletingLastPathComponent().appendingPathComponent("cfnb-server")
                  ]
                  
                  var executablePath: String?
                  for candidate in candidates {
                      if FileManager.default.fileExists(atPath: candidate) {
                          executablePath = candidate
                          break
                      }
                  }
                  
                  // Also check "web" directory relative to bundle
                  let webCandidates = [
                      exePath.appendingPathComponent("CFNB.app.web"),
                      exePath.appendingPathComponent("web"),
                      exePath.deletingLastPathComponent().appendingPathComponent("web")
                  ]
                  
                  var webDirPath: String?
                  for candidate in webCandidates {
                      if FileManager.default.fileExists(atPath: candidate) {
                          webDirPath = candidate
                          break
                      }
                  }
                  
                  guard let exe = executablePath else {
                      logger.error("cfnb-server binary not found in bundle")
                      logger.error("Bundle path: \(exePath)")
                      logger.error("Files: \(FileManager.default.enumerator(at: URL(fileURLWithPath: exePath as String), includingPropertiesForKeys: nil, options: .skipsSubdirectoryDescendants))?.allObjects ?? []")
                      return
                  }
                  
                  process!.executableURL = URL(fileURLWithPath: exe)
                  
                  var env = ProcessInfo.processInfo.environment
                  env["PORT"] = String(port)
                  if let webDir = webDirPath {
                      env["WEB_DIR"] = webDir
                  }
                  process!.environment = env
                  process!.launch()
                  
                  logger.info("Started cfnb-server from: \(exe)")
              }

              func loadDashboard() {
                  guard let wv = webView else { return }
                  let url = URL(string: "http://localhost:\(port)")!
                  wv.load(URLRequest(url: url))
                  logger.info("Loading dashboard at \(url.absoluteString)")
              }

              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                  logger.error("WebView load failed: \(error.localizedDescription)")
              }
          }
          SWIFTEOF
          
          echo "Files created:"
          ls -la
          echo "---"
          ls -la CFNB.app.web/ 2>/dev/null || echo "No web dir yet"
      
      - name: Generate project.pbxproj
        run: |
          cd ${{ github.workspace }}
          
          cat > CFNB.xcodeproj/project.pbxproj << 'EOFPROJ'
          // !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = { };
          	objectVersion = 56;
          	objects = {
          
          /* Begin PBXBuildFile section */
          		F1000001 /* main.swift in Sources */ = {isa = PBXBuildFile; fileRef = F1000101; };
          		F1000002 /* Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = F1000102; };
          		F1000003 /* CFNB.app.web in Resources */ = {isa = PBXBuildFile; fileRef = F1000104; };
          /* End PBXBuildFile section */
          
          /* Begin PBXFileReference section */
          		F1000101 /* main.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = main.swift; sourceTree = "<group>"; };
          		F1000102 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          		F1000103 /* CFNB.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CFNB.app; sourceTree = BUILT_PRODUCTS_DIR; };
          		F1000104 /* CFNB.app.web */ = {isa = PBXFileReference; lastKnownFileType = folder; path = CFNB.app.web; sourceTree = "<group>"; };
          /* End PBXFileReference section */
          
          /* Begin PBXGroup section */
          		F1000201 = {
          			isa = PBXGroup;
          			children = (
          				F1000301,
          			);
          			sourceTree = "<group>";
          		};
          		F1000301 /* Source files */ = {
          			isa = PBXGroup;
          			children = (
          				F1000101,
          				F1000102,
          				F1000104,
          			);
          			path = "";
          			sourceTree = "<group>";
          		};
          /* End PBXGroup section */
          
          /* Begin PBXNativeTarget section */
          		F10003T1 /* CFNB */ = {
          			isa = PBXNativeTarget;
          			buildConfigurationList = F1000502;
          			buildPhases = (
          				F10004S1,
          				F10004R1,
          				F10004F1,
          			);
          			buildRules = ( );
          			dependencies = ( );
          			name = CFNB;
          			productName = CFNB;
          			productReference = F1000103;
          			productType = "com.apple.product-type.application";
          		};
          /* End PBXNativeTarget section */
          
          /* Begin PBXProject section */
          		F1000901 = {
          			isa = PBXProject;
          			attributes = { BuildIndependentTargetsInParallel = 1; };
          			buildConfigurationList = F1000501;
          			compatibilityVersion = "Xcode 14.0";
          			developmentRegion = en;
          			hasScannedForEncodings = 0;
          			knownRegions = ( en, Base );
          			mainGroup = F1000201;
          			productRefGroup = F1000301;
          			projectDirPath = "";
          			projectRoot = "";
          			targets = (
          				F10003T1,
          			);
          		};
          /* End PBXProject section */
          
          /* Begin PBXResourcesBuildPhase section */
          		F10004R1 /* Resources */ = {
          			isa = PBXResourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( F1000002, F1000003, );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXResourcesBuildPhase section */
          
          /* Begin PBXSourcesBuildPhase section */
          		F10004S1 /* Sources */ = {
          			isa = PBXSourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( F1000001, );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXSourcesBuildPhase section */
          
          /* Begin PBXFrameworksBuildPhase section */
          		F10004F1 /* Frameworks */ = {
          			isa = PBXFrameworksBuildPhase;
          			buildActionMask = 2147483647;
          			files = ( );
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXFrameworksBuildPhase section */
          
          /* Begin XCBuildConfiguration section */
          		F1000A01 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				CODE_SIGN_STYLE = Manual;
          				CURRENT_PROJECT_VERSION = 1;
          				DEVELOPMENT_TEAM = "";
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = Info.plist;
          				LINKER_DISPLAYS_MANGLED_NAMES = NO;
          				PRODUCT_BUNDLE_IDENTIFIER = com.cfnb.app;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_EMIT_LOC_STRINGS = YES;
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Release;
          		};
          		F1000902 = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = dwarf;
          				ENABLE_STRICT_OBJC_MSGSEND = YES;
          				GCC_C_LANGUAGE_STANDARD = gnu17;
          				GCC_NO_COMMON_BLOCKS = YES;
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 12.0;
          				MTL_ENABLE_DEBUG_INFO = NO;
          				ONLY_ACTIVE_ARCH = YES;
          				SDKROOT = iphoneos;
          				SWIFT_OPTIMIZATION_LEVEL = "-Onone";
          				OTHER_SWIFT_FLAGS = "$(inherited) -parse-as-library";
          			};
          			name = Release;
          		};
          /* End XCBuildConfiguration section */
          
          /* Begin XCConfigurationList section */
          		F1000501 /* Build configuration list for PBXProject "CFNB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = ( F1000902, );
          			defaultConfigurationIsVisible = 0;
          		};
          		F1000502 /* Build configuration list for PBXNativeTarget "CFNB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = ( F1000A01, );
          			defaultConfigurationIsVisible = 0;
          		};
          /* End XCConfigurationList section */
          
          	};
          	rootObject = F1000901;
          }
          EOFPROJ
          
          echo "PBXProj generated successfully"
          wc -l CFNB.xcodeproj/project.pbxproj
      
      - name: Archive
        run: |
          cd ${{ github.workspace }}
          
          # Copy Go binaries to the right place for Xcode bundling
          mkdir -p CFNB.app
          cp cfnb-go/cfnb CFNB.app/cfnb
          cp cfnb-go/cfnb-server CFNB.app/cfnb-server
          chmod +x CFNB.app/cfnb CFNB.app/cfnb-server
          
          # Also make web dir accessible
          if [ ! -d "CFNB.app.web" ]; then
            echo "ERROR: CFNB.app.web not created by previous step!"
            exit 1
          fi
          
          # Verify pbxproj exists
          if [ ! -f "CFNB.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: project.pbxproj not found!"
            ls -la CFNB.xcodeproj/
            exit 1
          fi
          
          # List all files in the workspace to debug
          echo "=== Workspace files ==="
          find . -maxdepth 3 -not -path './.git/*' -not -path './.github/*' | sort
          
          # Try building first to verify the project is valid
          xcodebuild build \
            -scheme CFNB \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$GITHUB_WORKSPACE/build/SYM \
            OBJROOT=$GITHUB_WORKSPACE/build/OBJ \
            BUILD_DIR=$GITHUB_WORKSPACE/build \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -30
          
          echo "=== Build succeeded, now archiving ==="
          
          xcodebuild archive \
            -scheme CFNB \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/CFNB.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$GITHUB_WORKSPACE/build/SYM \
            OBJROOT=$GITHUB_WORKSPACE/build/OBJ \
            BUILD_DIR=$GITHUB_WORKSPACE/build \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Export IPA
        run: |
          cd ${{ github.workspace }}
          
          # Verify xcarchive exists
          if [ ! -d "build/CFNB.xcarchive" ]; then
            echo "ERROR: xcarchive not found!"
            exit 1
          fi
          
          # Find the CFNB.app inside the xcarchive
          APP_PATH="build/CFNB.xcarchive/Products/Applications/CFNB.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Contents of xcarchive:"
            find build/CFNB.xcarchive -type f 2>/dev/null | head -30
            echo "ERROR: CFNB.app not found in xcarchive!"
            exit 1
          fi
          
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          
          echo "Creating IPA via zip..."
          cd build
          zip -r CFNB.ipa Payload/
          cd ..
          
          if [ -f "build/CFNB.ipa" ]; then
            echo "IPA created successfully at build/CFNB.ipa"
            ls -lh build/CFNB.ipa
          else
            echo "ERROR: IPA file not found after zip"
            find build -name "*.ipa" 2>/dev/null
            ls -la build/
            exit 1
          fi
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb .
          
          # Also build the web server (with embedded web assets)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="$(xcrun -sdk iphoneos find clang)" \
            CXX="$(xcrun -sdk iphoneos find clang++)" \
            CFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            CXXFLAGS="-arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0" \
            go build -o cfnb-server ./cmd/server/
          
          file cfnb
          file cfnb-server
      
      - name: Create Info.plist and bundle structure
        run: |
          cd ${{ github.workspace }}
          
          # Create app bundle directory
          mkdir -p Payload/CFNB.app
          
          # Copy Go binaries
          cp cfnb-go/cfnb-server Payload/CFNB.app/cfnb-server
          chmod +x Payload/CFNB.app/cfnb-server
          
          # Create Info.plist for the bundle
          cat > Payload/CFNB.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>cfnb-server</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>NSExtensionPointIdentifier</key>
              <string>com.apple.UIKit.app</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
          
          # Copy web assets
          if [ -d "cfnb-go/web" ]; then
            cp -r cfnb-go/web Payload/CFNB.app/web
          fi
          
          echo "Payload structure:"
          find Payload -type f | sort
      
      - name: Package IPA (no Xcode needed)
        run: |
          cd ${{ github.workspace }}
          
          # IPA is just a zip of Payload/
          cd build
          zip -r CFNB.ipa Payload/
          cd ..
          
          ls -lh build/CFNB.ipa
          echo "IPA ready!"
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA for CFNB
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build Go binary for iOS/arm64
        working-directory: ${{ github.workspace }}/cfnb-go
        run: |
          cp -r web cmd/server/web
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o cfnb-server ./cmd/server/
          echo "Go binary built: $(ls -lh cfnb-server)"
      
      - name: Build ObjC app binary
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          cat > main.m << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <spawn.h>
          extern char **environ;
          
          @interface AppDelegate : UIResponder <UIApplicationDelegate, WKNavigationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) WKWebView *webView;
          @property (assign, nonatomic) int retryCount;
          @end
          
          @implementation AppDelegate
          
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.retryCount = 0;
              WKWebViewConfiguration *c = [[WKWebViewConfiguration alloc] init];
              self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:c];
              self.webView.navigationDelegate = self;
              self.webView.opaque = NO;
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view = self.webView;
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              [self showLoading];
              NSString *path = [[[NSBundle mainBundle] bundlePath] stringByAppendingPathComponent:@"cfnb-server"];
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  pid_t p;
                  const char *argv[] = {[path UTF8String], NULL};
                  posix_spawn(&p, [path UTF8String], NULL, NULL, (char *const *)argv, environ);
              });
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self tryLoad];
              });
              return YES;
          }
          
          - (void)showLoading {
              [self.webView loadHTMLString:@"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{background:#0d1117;color:#8b949e;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column}@keyframes s{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}d{width:40px;height:40px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:s 1s infinite;margin-bottom:16px}p{font-size:13px;margin:4px 0}</style></head><body><d></d><p>Starting CFNB Server...</p></body></html>" baseURL:nil];
          }
          
          - (void)tryLoad {
              self.retryCount++;
              NSMutableURLRequest *r = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:@"http://127.0.0.1:8080"]];
              r.timeoutInterval = 3;
              [[NSURLSession.sharedSession dataTaskWithRequest:r completionHandler:^(NSData *d, NSURLResponse *rsp, NSError *e) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (!e && [(NSHTTPURLResponse *)rsp statusCode] == 200) {
                          [self.webView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"http://127.0.0.1:8080"]]];
                      } else if (self.retryCount < 20) {
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ [self tryLoad]; });
                      } else {
                          [self.webView loadHTMLString:@"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{background:#0d1117;color:#f85149;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-size:13px}</style></head><body>Server failed.<br/>iOS may block subprocess.</body></html>" baseURL:nil];
                      }
                  });
              }] resume];
          }
          
          @end
          
          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class])); }
          }
          OBJCEOF
          
          clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=12.0 \
            -framework UIKit -framework WebKit -framework Foundation \
            -fobjc-arc -o CFNB main.m
          cp cfnb-go/cfnb-server .
          echo "ObjC binary built: $(ls -lh CFNB)"
      
      - name: Create app bundle and IPA
        run: |
          cd ${{ github.workspace }}
          mkdir -p Payload/CFNB.app
          cp CFNB Payload/CFNB.app/CFNB
          cp cfnb-server Payload/CFNB.app/cfnb-server
          chmod +x Payload/CFNB.app/CFNB Payload/CFNB.app/cfnb-server
          cp -r cfnb-go/web Payload/CFNB.app/web
          
          cat > Payload/CFNB.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CFNB</string>
              <key>CFBundleIdentifier</key>
              <string>com.cfnb.app</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>CFNB</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
          
          echo "Bundle structure:"
          find Payload -type f | sort
          
          mkdir -p build
          cd build
          zip -r CFNB.ipa ../Payload/
          cd ..
          
          ls -lh build/CFNB.ipa
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFNB-iPA-Build
          path: build/CFNB.ipa
          retention-days: 30

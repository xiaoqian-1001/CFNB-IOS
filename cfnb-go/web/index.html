<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CFNB - Cloudflare IP 优选工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; min-height: 100dvh; padding: 0; margin: 0; }
.container { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
.header { text-align: center; padding: 24px 0 16px; }
.header h1 { font-size: 26px; color: #f0f6fc; margin-bottom: 6px; }
.header p { color: #8b949e; font-size: 13px; }
.controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.controls .config-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b949e; flex-wrap: wrap; }
.controls .config-group label { white-space: nowrap; }
.controls .config-group input, .controls .config-group select { padding: 4px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 12px; outline: none; width: 70px; }
.controls .config-group select { width: auto; }
.controls .config-group input:focus, .controls .config-group select:focus { border-color: #58a6ff; }
.btn { padding: 10px 20px; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .2s; background: #21262d; color: #c9d1d9; -webkit-user-select: none; user-select: none; }
.btn:hover:not(:disabled) { background: #30363d; border-color: #8b949e; }
.btn-primary { background: #238636; border-color: #238636; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #2ea043; border-color: #2ea043; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.progress-bar { flex: 1; min-width: 140px; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #238636, #2ea043); border-radius: 3px; transition: width .5s ease; width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.card-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.card-value { font-size: 22px; font-weight: 700; color: #f0f6fc; }
.card-value.speed { color: #58a6ff; }
.card-value.latency { color: #3fb950; }
.card-value.count { color: #d29922; }
.phase-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.phase-tag { padding: 3px 10px; border-radius: 10px; font-size: 11px; background: #21262d; border: 1px solid #30363d; color: #8b949e; }
.phase-tag.active { background: #1f6feb22; border-color: #1f6feb; color: #58a6ff; }
.phase-tag.done { background: #23863622; border-color: #238636; color: #3fb950; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
.panel-header { padding: 10px 14px; border-bottom: 1px solid #30363d; font-weight: 600; font-size: 13px; color: #f0f6fc; display: flex; align-items: center; justify-content: space-between; }
.panel-body { padding: 12px; max-height: 360px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.log-line { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 11px; padding: 2px 0; color: #8b949e; line-height: 1.5; word-break: break-all; }
.log-line.info { color: #58a6ff; }
.log-line.success { color: #3fb950; }
.log-line.warn { color: #d29922; }
.log-line.error { color: #f85149; }
.table-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
.table-header { padding: 10px 14px; border-bottom: 1px solid #30363d; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.table-header input { margin-left: auto; padding: 4px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 12px; width: 160px; outline: none; }
.table-header input:focus { border-color: #58a6ff; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 8px 12px; background: #21262d; font-size: 11px; font-weight: 600; color: #8b949e; border-bottom: 1px solid #30363d; cursor: pointer; -webkit-user-select: none; user-select: none; }
th:hover { color: #c9d1d9; }
td { padding: 8px 12px; border-bottom: 1px solid #21262d; font-size: 12px; }
tr:hover td { background: #1c2128; }
.speed-bar { display: inline-block; height: 4px; background: #58a6ff; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
.empty-state { text-align: center; padding: 40px 16px; color: #484f58; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-dot.running { background: #d29922; animation: pulse 1s infinite; }
.status-dot.idle { background: #484f58; }
.status-dot.done { background: #3fb950; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

@media (max-width: 768px) {
  .panels { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .controls { flex-direction: column; align-items: stretch; }
  .controls .config-group { flex-wrap: wrap; }
  .container { padding: 12px; }
  .panel-body { max-height: 280px; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>CFNB <span class="badge" style="display:inline-block;padding:2px 8px;background:#238636;color:#fff;border-radius:12px;font-size:11px;vertical-align:middle">v2.0 Go</span></h1>
    <p>Cloudflare CDN IP 优选工具 - 自动节点筛选与测速</p>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="runBtn" onclick="startPipeline()">
      <span id="runIcon">&#9654;</span> <span id="runText">开始测速</span>
    </button>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span style="font-size:12px;color:#8b949e" id="statusText">
      <span class="status-dot idle"></span> 就绪
    </span>
  </div>

  <div class="controls" style="margin-top:0">
    <div class="config-group">
      <label>测速文件</label>
      <select id="cfgBandwidthSize" onchange="saveConfig()">
        <option value="1">1 MB</option>
        <option value="5">5 MB</option>
        <option value="10">10 MB</option>
        <option value="25">25 MB</option>
        <option value="50">50 MB</option>
        <option value="100">100 MB</option>
      </select>
      <label>候选数</label>
      <input type="number" id="cfgCandidates" value="150" min="10" max="500" onchange="saveConfig()">
      <label>模式</label>
      <select id="cfgMode" onchange="saveConfig()">
        <option value="global">全局最优</option>
        <option value="percountry">按国家最优</option>
      </select>
      <label>TCP探测</label>
      <input type="number" id="cfgTCPProbes" value="1" min="1" max="10" onchange="saveConfig()">
      <label>测速并发</label>
      <input type="number" id="cfgBWWorkers" value="3" min="1" max="50" onchange="saveConfig()">
    </div>
  </div>

  <div class="phase-tags" id="phases">
    <span class="phase-tag">1. 获取数据源</span>
    <span class="phase-tag">2. TCP 测试</span>
    <span class="phase-tag">3. 可用性筛选</span>
    <span class="phase-tag">4. HTTP 检测</span>
    <span class="phase-tag">5. 带宽测速</span>
    <span class="phase-tag">6. 完成</span>
  </div>

  <div class="cards" id="statsCards">
    <div class="card">
      <div class="card-label">总节点数</div>
      <div class="card-value count" id="statNodes">-</div>
    </div>
    <div class="card">
      <div class="card-label">总带宽</div>
      <div class="card-value speed" id="statBW">-</div>
    </div>
    <div class="card">
      <div class="card-label">最快速度</div>
      <div class="card-value speed" id="statBestSpeed">-</div>
    </div>
    <div class="card">
      <div class="card-label">平均延迟</div>
      <div class="card-value latency" id="statLatency">-</div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">终端输出</div>
      <div class="panel-body" id="logPanel">
        <div class="empty-state" style="padding:30px">
          <p>点击「开始测速」启动管道</p>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">管道状态</div>
      <div class="panel-body" id="statusPanel">
        <div class="empty-state" style="padding:30px">
          <p>等待管道启动...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="table-wrap" id="resultsTable" style="display:none">
    <div class="table-header">
      <span style="color:#f0f6fc">优选节点</span>
      <input type="text" placeholder="搜索国家或 IP..." id="filterInput" oninput="filterTable()">
    </div>
    <div style="max-height:480px;overflow-y:auto;-webkit-overflow-scrolling:touch">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable(0)">#</th>
            <th onclick="sortTable(1)">IP 地址</th>
            <th onclick="sortTable(2)">国家</th>
            <th onclick="sortTable(3)">速度 (Mbps)</th>
            <th onclick="sortTable(4)">延迟 (ms)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const phases = ['获取数据源','TCP 测试','可用性筛选','HTTP 检测','带宽测速','完成'];
let results = null;
let sortCol = -1;
let sortAsc = true;

function setPhase(n) {
  document.querySelectorAll('.phase-tag').forEach((t,i) => {
    t.className = 'phase-tag' + (i < n ? ' done' : '') + (i === n ? ' active' : '');
  });
}

function saveConfig() {
  const cfg = {
    bandwidthSize: parseFloat(document.getElementById('cfgBandwidthSize').value),
    candidates: parseInt(document.getElementById('cfgCandidates').value) || 150,
    mode: document.getElementById('cfgMode').value,
    tcpProbes: parseInt(document.getElementById('cfgTCPProbes').value) || 1,
    bandwidthWorkers: parseInt(document.getElementById('cfgBWWorkers').value) || 3
  };
  localStorage.setItem('cfnbConfig', JSON.stringify(cfg));
}

function loadConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem('cfnbConfig'));
    if (saved) {
      document.getElementById('cfgBandwidthSize').value = saved.bandwidthSize || 1;
      document.getElementById('cfgCandidates').value = saved.candidates || 150;
      document.getElementById('cfgMode').value = saved.mode || 'global';
      document.getElementById('cfgTCPProbes').value = saved.tcpProbes || 1;
      document.getElementById('cfgBWWorkers').value = saved.bandwidthWorkers || 3;
    }
  } catch(e) {}
}
loadConfig();

function startPipeline() {
  const cfg = {
    bandwidthSize: parseFloat(document.getElementById('cfgBandwidthSize').value),
    candidates: parseInt(document.getElementById('cfgCandidates').value) || 150,
    mode: document.getElementById('cfgMode').value,
    tcpProbes: parseInt(document.getElementById('cfgTCPProbes').value) || 1,
    bandwidthWorkers: parseInt(document.getElementById('cfgBWWorkers').value) || 3
  };
  fetch('/api/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(cfg) })
    .then(r => r.json())
    .then(d => { if (!d.ok) alert('管道正在运行中'); })
    .catch(e => alert('启动失败: ' + e));
}

function connectSSE() {
  const evtSource = new EventSource('/api/events');
  evtSource.onmessage = function(e) {
    try {
      const s = JSON.parse(e.data);
      updateUI(s);
    } catch(ex) {}
  };
  evtSource.onerror = function() {
    setTimeout(connectSSE, 3000);
  };
}

function updateUI(s) {
  const btn = document.getElementById('runBtn');
  const icon = document.getElementById('runIcon');
  const text = document.getElementById('runText');
  const st = document.getElementById('statusText');
  const fill = document.getElementById('progressFill');

  if (s.running) {
    btn.disabled = true;
    text.textContent = '运行中...';
    st.innerHTML = '<span class="status-dot running"></span> ' + (s.progress || '运行中');
    fill.style.width = estimateProgress(s.progress) + '%';

    if (s.progress) {
      const idx = phases.findIndex(p => s.progress.includes(p));
      if (idx >= 0) setPhase(idx);
    }
  } else if (s.results) {
    btn.disabled = false;
    text.textContent = '开始测速';
    st.innerHTML = '<span class="status-dot done"></span> 完成';
    fill.style.width = '100%';
    setPhase(phases.length);
    showResults(s.results);
  } else {
    btn.disabled = false;
    text.textContent = '开始测速';
    st.innerHTML = '<span class="status-dot idle"></span> 就绪';
  }

  updateLogs(s.logs || []);
  updateStatusPanel(s);
}

function estimateProgress(p) {
  if (!p) return 0;
  for (let i = 0; i < phases.length; i++) {
    if (p.includes(phases[i])) return ((i + 1) / phases.length) * 100;
  }
  return 0;
}

function updateLogs(logs) {
  const panel = document.getElementById('logPanel');
  if (!logs || logs.length === 0) return;
  panel.innerHTML = '';
  logs.forEach(l => {
    const div = document.createElement('div');
    div.className = 'log-line';
    if (l.includes('ERROR') || l.includes('错误')) div.className += ' error';
    else if (l.includes('成功') || l.includes('完成') || l.includes('通过')) div.className += ' success';
    else if (l.includes('进度') || l.includes('Phase') || l.includes('开始')) div.className += ' info';
    else if (l.includes('失败') || l.includes('跳过') || l.includes('错误')) div.className += ' warn';
    div.textContent = l;
    panel.appendChild(div);
  });
  panel.scrollTop = panel.scrollHeight;
}

function updateStatusPanel(s) {
  const panel = document.getElementById('statusPanel');
  if (s.results && s.results.nodes) {
    const r = s.results;
    panel.innerHTML = `
      <div style="margin-bottom:10px"><span style="color:#3fb950">&#10003;</span> <strong>管道完成</strong> - 已筛选 ${r.nodes.length} 个节点</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#21262d;padding:10px;border-radius:6px">
          <div style="font-size:11px;color:#8b949e">总带宽</div>
          <div style="font-size:18px;font-weight:700;color:#58a6ff">${r.totalBandwidth.toFixed(1)} Mbps</div>
        </div>
        <div style="background:#21262d;padding:10px;border-radius:6px">
          <div style="font-size:11px;color:#8b949e">平均延迟</div>
          <div style="font-size:18px;font-weight:700;color:#3fb950">${r.avgLatency.toFixed(1)} ms</div>
        </div>
      </div>
    `;
  } else if (s.running) {
    const phases = ['Phase 1/6: 获取数据源','Phase 2/6: TCP 测试','Phase 3/6: 可用性筛选','Phase 4/6: HTTP 检测','Phase 5/6: 带宽测速','Phase 6/6: 完成'];
    panel.innerHTML = '<div style="display:flex;flex-direction:column;gap:6px">' +
      phases.map((p,i) => {
        let icon = '<span style="color:#30363d;margin-right:8px">&#9711;</span>';
        if (s.progress && s.progress.includes(p.split(':')[0])) icon = '<span style="color:#d29922;margin-right:8px">&#9712;</span>';
        if (s.progress && phases.some((pp,j) => j < i && s.progress.includes(pp.split(':')[0]))) icon = '<span style="color:#3fb950;margin-right:8px">&#10003;</span>';
        return `<div style="font-size:12px;padding:6px;border-radius:4px;background:#21262d">${icon}${p}</div>`;
      }).join('') + '</div>';
  }
}

function showResults(r) {
  results = r;
  document.getElementById('resultsTable').style.display = 'block';
  document.getElementById('statNodes').textContent = r.nodes.length;
  document.getElementById('statBW').textContent = r.totalBandwidth.toFixed(1) + ' Mbps';
  document.getElementById('statBestSpeed').textContent = (r.nodes.length > 0 ? Math.max(...r.nodes.map(n => n.speed || 0)).toFixed(1) : 0) + ' Mbps';
  document.getElementById('statLatency').textContent = r.avgLatency.toFixed(1) + ' ms';
  renderTable(r.nodes);
}

function renderTable(nodes) {
  const tbody = document.getElementById('tableBody');
  const filter = (document.getElementById('filterInput').value || '').toLowerCase();
  let filtered = nodes;
  if (filter) {
    filtered = nodes.filter(n => n.node.toLowerCase().includes(filter) || (n.ccTag && n.ccTag.toLowerCase().includes(filter)) || (n.country && n.country.toLowerCase().includes(filter)));
  }

  tbody.innerHTML = filtered.map((n, i) => {
    const speeds = nodes.map(x => x.speed || 0);
    const maxSpeed = speeds.length > 0 ? Math.max(...speeds) : 1;
    const barW = maxSpeed > 0 ? Math.min(100, (n.speed / maxSpeed) * 100) : 0;
    return `<tr>
      <td style="color:#484f58">${i + 1}</td>
      <td style="font-family:monospace;color:#f0f6fc">${escapeHtml(n.node.split('#')[0] || n.node)}</td>
      <td>${n.country || n.ccTag || '-'}</td>
      <td><span style="color:#58a6ff;font-weight:600">${n.speed.toFixed(1)}</span><span class="speed-bar" style="width:${barW * 0.5}%"></span></td>
      <td style="color:#c9d1d9">${n.latency > 0 ? n.latency.toFixed(1) + ' ms' : '-'}</td>
    </tr>`;
  }).join('');
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filterTable() {
  if (results) renderTable(results.nodes);
}

function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  if (!results) return;

  const nodes = [...results.nodes];
  const keys = ['node','node','ccTag','speed','latency'];
  nodes.sort((a,b) => {
    let va = a[keys[col]] || '', vb = b[keys[col]] || '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return (va < vb ? -1 : va > vb ? 1 : 0) * (sortAsc ? 1 : -1);
  });
  renderTable(nodes);
}

connectSSE();
</script>
</body>
</html>
